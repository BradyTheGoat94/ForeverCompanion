name: Validate and package addon
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          find ForeverCompanion -name '*.lua' -print0 | xargs -0 -r luac5.1 -p
      - name: Run mocked WoW API smoke tests
        run: lua5.1 tests/offline_smoke.lua
      - name: Exercise addon UI in mocked client
        run: lua5.1 tests/mock_ui.lua
      - name: Validate manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ForeverCompanion")
          toc = root / "ForeverCompanion.toc"
          assert toc.is_file(), "Missing .toc"
          lines = toc.read_text(encoding="utf-8").splitlines()
          assert any(line.startswith("## Interface:") for line in lines), "Missing Interface field"
          lua_files = [line.strip() for line in lines if line.strip() and not line.startswith("#")]
          assert lua_files, "No files in manifest"
          for name in lua_files:
              assert name.endswith(".lua"), f"Unexpected manifest entry: {name}"
              assert (root / name).is_file(), f"Missing Lua file: {name}"
          print("Validated", len(lua_files), "manifest files")
          PY
      - name: Audit release compatibility
        run: python3 release_audit.py
      - name: Package addon
        run: zip -r ForeverCompanion.zip ForeverCompanion -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverCompanion
          path: ForeverCompanion.zip
          if-no-files-found: error
