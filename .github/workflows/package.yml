name: Validate and package addon
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          find ForeverCompanion -name '*.lua' -print0 | xargs -0 -r luac5.1 -p
      - name: Run mocked WoW API smoke tests
        run: |
          lua5.1 tests/offline_smoke.lua
          lua5.1 tests/loot_boss_smoke.lua
          lua5.1 tests/icons_and_gear_smoke.lua
          lua5.1 tests/study_board_smoke.lua
          lua5.1 tests/research_notebook_smoke.lua
      - name: Exercise addon UI in mocked client
        run: lua5.1 tests/mock_ui.lua
      - name: Render offline UI preview
        run: |
          python3 -m pip install --quiet pillow
          python3 tests/render_ui_snapshot.py
          python3 tests/render_class_preview.py
          python3 tests/render_section_previews.py
          python3 tests/render_planning_previews.py
          python3 tests/render_encounter_preview.py
          python3 tests/render_native_preview.py
      - name: Upload offline UI text snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ui-snapshot
          path: |
            ui_snapshot.txt
            ui_preview.png
            ui_leveling_snapshot.txt
            ui_class_preview.png
            ui_quest_snapshot.txt
            ui_profession_snapshot.txt
            ui_quest_preview.png
            ui_profession_preview.png
            ui_dungeon_snapshot.txt
            ui_pvp_snapshot.txt
            ui_dungeon_preview.png
            ui_pvp_preview.png
            ui_settings_snapshot.txt
            ui_settings_preview.png
            ui_legacy_snapshot.txt
            ui_alts_snapshot.txt
            ui_loot_snapshot.txt
            ui_encounter_snapshot.txt
            ui_encounter_preview.png
            ui_dashboard_native.json
            ui_dashboard_native.png
            ui_class_native.json
            ui_class_native.png
            ui_rotation_native.png
            ui_topic_native.json
            ui_topic_native.png
            ui_gear_native.json
            ui_gear_native.png
            ui_loot_native.json
            ui_loot_native.png
            ui_long_priority_native.json
            ui_long_priority_native.png
            ui_practice_snapshot.txt
            ui_legacy_preview.png
            ui_alts_preview.png
            ui_practice_preview.png
            ui_legacy_native.json
            ui_alts_native.json
            ui_practice_native.json
            ui_legacy_native.png
            ui_alts_native.png
            ui_practice_native.png
          if-no-files-found: ignore
      - name: Validate manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ForeverCompanion")
          toc = root / "ForeverCompanion.toc"
          assert toc.is_file(), "Missing .toc"
          lines = toc.read_text(encoding="utf-8").splitlines()
          assert any(line.startswith("## Interface:") for line in lines), "Missing Interface field"
          lua_files = [line.strip() for line in lines if line.strip() and not line.startswith("#")]
          assert lua_files, "No files in manifest"
          for name in lua_files:
              assert name.endswith(".lua"), f"Unexpected manifest entry: {name}"
              assert (root / name).is_file(), f"Missing Lua file: {name}"
          print("Validated", len(lua_files), "manifest files")
          PY
      - name: Verify guide completeness and safety labeling
        run: python3 tests/validate_guide_preflight.py
      - name: Audit release compatibility
        run: python3 release_audit.py
      - name: Validate beta release gate and required documentation
        run: python3 tests/validate_beta_gate.py
      - name: Package addon
        run: zip -r ForeverCompanion.zip ForeverCompanion -x '*.DS_Store'
      - name: Verify packaged addon integrity and manifest completeness
        run: python3 tests/validate_package.py ForeverCompanion.zip
      - name: Record beta package provenance
        run: python3 tests/write_build_manifest.py
      - name: Verify beta provenance against packaged ZIP
        run: python3 tests/validate_build_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverCompanion
          path: |
            ForeverCompanion.zip
            beta-build-manifest.json
          if-no-files-found: error


