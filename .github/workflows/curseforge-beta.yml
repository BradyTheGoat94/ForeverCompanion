name: CurseForge beta package audit
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
      - name: Install Lua 5.1 test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Parse all packaged Lua files
        run: find ForeverCompanion -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run addon offline smoke tests
        run: lua5.1 tests/offline_smoke.lua
      - name: Run study-board interaction tests
        run: lua5.1 tests/study_board_smoke.lua
      - name: Verify Python release tooling compiles
        run: python3 -m py_compile tools/build_curseforge_beta.py tools/audit_forever_apis.py tools/audit_no_combat_automation.py
      - name: Scan for removed legacy API calls
        run: python3 tools/audit_forever_apis.py
      - name: Reject combat automation indicators
        run: python3 tools/audit_no_combat_automation.py
      - name: Validate addon manifest and bundled files
        run: python3 tools/build_curseforge_beta.py --check-only
      - name: Build reproducible installable beta ZIP
        run: python3 tools/build_curseforge_beta.py --output dist
      - name: Verify deterministic archive output
        run: |
          mkdir -p dist-repeat
          python3 tools/build_curseforge_beta.py --output dist-repeat
          python3 - <<'PY'
          import hashlib, json, pathlib
          first = json.loads(pathlib.Path('dist/release-audit.json').read_text())
          second = json.loads(pathlib.Path('dist-repeat/release-audit.json').read_text())
          assert first['sha256'] == second['sha256'], 'ZIP differs between builds of same source'
          assert first['files'] == second['files']
          print('Deterministic ZIP and manifest count verified')
          PY
      - name: Inspect ZIP and checksum
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          report = json.loads(pathlib.Path("dist/release-audit.json").read_text())
          archive = pathlib.Path("dist") / report["archive"]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == report["sha256"]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert all(x.startswith("ForeverCompanion/") for x in z.namelist())
              assert "ForeverCompanion/ForeverCompanion.toc" in z.namelist()
          print("Archive integrity verified; in-game compatibility remains untested")
          PY
      - name: Upload beta package for review (not published)
        uses: actions/upload-artifact@v4
        with:
          name: bradys-forever-companion-beta-review
          path: |
            dist/*.zip
            dist/release-audit.json
          if-no-files-found: error
